[project]
name = "bn-monitor"
version = "0.1.0"
description = "Binance USD-M futures market anomaly monitor MVP"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
bn-monitor = "bn_monitor.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bn_monitor*"]
